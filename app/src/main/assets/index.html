<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Number System Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef6ff;font-family:Arial,sans-serif;color:#182235}
.app{max-width:520px;margin:auto;padding:18px;min-height:100vh}h1{text-align:center;font-size:28px;margin:8px 0}.sub{text-align:center;color:#687386;font-size:18px;margin-bottom:16px}
.progress{height:10px;background:#dbe5f1;border-radius:20px;overflow:hidden}.fill{height:100%;width:20%;background:#4d89f5}
.card{background:#fff;border-radius:25px;padding:20px;margin-top:18px;box-shadow:0 8px 30px rgba(40,70,100,.12)}
.boy{text-align:center;font-size:78px;margin-top:5px}.message{background:#eef5ff;border-radius:18px;padding:12px;text-align:center;font-size:17px;font-weight:600;margin:8px 0 18px}
.question{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:14px}.option{display:block;width:100%;min-height:58px;margin:10px 0;padding:12px 15px;text-align:left;background:#fff;border:2px solid #dbe3ed;border-radius:16px;font-size:17px;touch-action:manipulation}
.option.correct{background:#e8f8ee!important;border-color:#35a66b!important}.mainbtn{display:block;width:100%;min-height:56px;margin-top:16px;border:0;border-radius:16px;background:#4d89f5;color:white;font-weight:700;font-size:18px;touch-action:manipulation}
.hint{background:#fff8dc;border-left:5px solid #f0b72b;border-radius:12px;padding:13px;margin-top:12px;line-height:1.4}.hidden{display:none!important}.count{text-align:center;color:#6d7685;margin-top:14px}
.bounce{animation:bounce .55s}.shake{animation:shake .35s}@keyframes bounce{50%{transform:translateY(-14px) scale(1.08)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.result{text-align:center}.result .trophy{font-size:60px}
</style>
</head>
<body>
<div class="app">
<h1>🔢 Number System Quiz</h1><div class="sub">Learn • Think • Try Again • Succeed</div>
<div class="progress"><div id="fill" class="fill"></div></div>
<div id="quizCard" class="card">
<div id="boy" class="boy">🧑‍🎓</div>
<div id="message" class="message">Welcome! Tap Start Quiz to begin.</div>
<div id="question" class="question">1. Which of the following is a natural number?</div>
<div id="answers">
<button class="option" onclick="choose(0)">A. 0</button>
<button class="option" onclick="choose(1)">B. 1</button>
<button class="option" onclick="choose(2)">C. −1</button>
<button class="option" onclick="choose(3)">D. 3/2</button>
</div>
<div id="hint" class="hint hidden"></div>
<button id="start" class="mainbtn" onclick="startQuiz()">▶ Start Quiz</button>
<button id="next" class="mainbtn hidden" onclick="nextQuestion()">Next Question ➜</button>
<div id="count" class="count">Question 1 of 5</div>
</div>
<div id="result" class="card result hidden"></div>
</div>
<script>
var questions=[
{q:"1. Which of the following is a natural number?",o:["0","1","−1","3/2"],a:1,h:"Natural numbers start from 1, 2, 3, 4, …"},
{q:"2. Which of the following is whole number?",o:["1/2","√3","0","−1"],a:2,h:"Whole numbers include 0, 1, 2, 3, …"},
{q:"3. Which of the following is correct?",o:["Every natural number is a whole number","Every natural number is not a whole number","Every integer is a whole number","None of the above"],a:0,h:"Think about the relationship between natural numbers and whole numbers."},
{q:"4. The general form of even number is:",o:["2n","2n + 1","n","n(n + 1)/2"],a:0,h:"Think about numbers that are exactly divisible by 2."},
{q:"5. The general form of odd number is:",o:["2n","2n + 1","n","n(n + 1)/2"],a:1,h:"Think of an even number and then add 1."}
];
var current=0,score=0,started=false,locked=false;
function startQuiz(){started=true;document.getElementById("start").classList.add("hidden");showQuestion();}
function showQuestion(){locked=false;var q=questions[current];document.getElementById("fill").style.width=((current+1)*20)+"%";document.getElementById("question").innerHTML=q.q;document.getElementById("count").innerHTML="Question "+(current+1)+" of 5";document.getElementById("message").innerHTML="Choose an answer. If you are unsure, I will give you a clue.";document.getElementById("hint").classList.add("hidden");document.getElementById("next").classList.add("hidden");document.getElementById("boy").className="boy";var box=document.getElementById("answers");box.innerHTML="";for(var i=0;i<q.o.length;i++){box.innerHTML+='<button class="option" onclick="choose('+i+')">'+String.fromCharCode(65+i)+". "+q.o[i]+"</button>";}}
function choose(index){if(!started||locked)return;var q=questions[current];if(index===q.a){locked=true;score++;document.getElementById("boy").className="boy bounce";document.getElementById("message").innerHTML=["Excellent! 🎉","Great job! ⭐","Correct! 🌟","Well done! 👏","Amazing! 🏆"][current];document.getElementById("hint").classList.add("hidden");var buttons=document.querySelectorAll("#answers .option");buttons[index].className+=" correct";for(var i=0;i<buttons.length;i++)buttons[i].disabled=true;var n=document.getElementById("next");n.innerHTML=current===4?"🏆 See My Result":"Next Question ➜";n.classList.remove("hidden");}else{document.getElementById("boy").className="boy shake";document.getElementById("message").innerHTML="That's okay! No problem — try again. 💡";document.getElementById("hint").innerHTML="💡 Clue: "+q.h;document.getElementById("hint").classList.remove("hidden");}}
function nextQuestion(){if(!locked)return;current++;if(current<5)showQuestion();else finish();}
function finish(){document.getElementById("quizCard").classList.add("hidden");var r=document.getElementById("result");r.classList.remove("hidden");var msg=score===5?"Outstanding! You mastered the Number System! 🏆":score>=3?"Great effort! Keep practising and you will improve! 🌟":"Good attempt! Mistakes are part of learning. Keep trying! 💪";r.innerHTML='<div class="trophy">🏆</div><h2>Quiz Completed!</h2><h1>'+score+' / 5</h1><p>'+msg+'</p><button class="mainbtn" onclick="location.reload()">🔄 Try Again</button>';}
</script>
</body>
</html>
